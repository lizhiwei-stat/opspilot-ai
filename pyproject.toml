[project]
name = "opspilot-ai"
version = "0.2.0"
description = "OpsPilot AI - Production-oriented AI Support & Ticket Resolution Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.162.0,<0.163",
  "uvicorn[standard]>=0.54.0,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy>=2.1.6,<2.2",
  "alembic>=1.20,<2",
  "psycopg[binary]>=3.3,<4",
  "pgvector>=0.5.1,<0.6",
  "pyjwt>=2.15,<3",
  "pwdlib[argon2]>=0.3.1,<0.4",
  "structlog>=26.1,<27",
  "httpx>=0.28,<0.29",
  "openai>=3.42,<4",
  "jieba==0.42.1",
  "pypdf>=6.21,<7",
  "langchain-text-splitters>=1.1.3,<2",
  "python-multipart>=0.0.33,<0.1",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9,<3",
    "pytest>=9.2,<10",
    "python-dotenv>=1.1,<2",
    "ruff>=0.17.3,<0.18",
]
notebook = [
    "ipykernel>=7.4,<8",
    "nbclient>=0.11,<0.12",
    "nbconvert>=7.17,<8",
]

# Optional: free local CPU embedding / cross-encoder reranker (Stage 2.5).
#   uv sync --group local-embed      (torch comes from the PyTorch CPU wheel index)
# Default install, Docker image and mock tests do NOT need this group.
local-embed = [
    "torch>=2.6,<3",
    "sentence-transformers>=5.1,<6",
    "transformers>=4.56,<5",
]

[tool.uv]
# local-embed is opt-in; `uv sync` (default groups) stays torch-free.
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/opspilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
markers = [
  "integration: requires a real PostgreSQL + pgvector (OPSPILOT_TEST_DATABASE_URL)",
  "local_model: needs the local-embed group + cached HF models (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src", "tests", "scripts"]

[tool.ruff.format]
# The walkthrough notebook is generated by scripts/build_notebook.py and keeps its outputs;
# Markdown code samples in docs are illustrative.
exclude = ["notebooks/*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
"scripts/**" = ["S101", "S105", "S106"]
"evals/**" = ["E501", "S603", "S607"]
# notebook = teaching walkthrough (generated by scripts/build_notebook.py): long prints, inline imports
"notebooks/**" = ["E501", "E401", "E402", "E731", "S101", "S603", "I001", "F401", "B905", "RUF001", "RUF003"]
"scripts/build_notebook.py" = ["E501"]  # offline report script: long f-strings, calls `git`
"frontend/e2e/**" = ["S101", "S310"]
"backend/src/opspilot/rag/**" = ["E501"]
"backend/migrations/**" = ["E501"]
