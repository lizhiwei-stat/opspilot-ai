[project]
name = "opspilot-ai"
version = "0.1.0"
description = "OpsPilot AI - Production-oriented AI Support & Ticket Resolution Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.162.0,<0.163",
  "uvicorn[standard]>=0.54.0,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy>=2.1.6,<2.2",
  "alembic>=1.20,<2",
  "psycopg[binary]>=3.3,<4",
  "pgvector>=0.5.1,<0.6",
  "pyjwt>=2.15,<3",
  "pwdlib[argon2]>=0.3.1,<0.4",
  "structlog>=26.1,<27",
  "httpx>=0.28,<0.29",
  "openai>=3.42,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "python-dotenv>=1.1,<2",
    "ruff>=0.17.3,<0.18",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/opspilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
markers = ["integration: requires a real PostgreSQL + pgvector (OPSPILOT_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S105", "S106"]
"backend/migrations/**" = ["E501"]
