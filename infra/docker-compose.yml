# OpsPilot AI local stack. Run from the repo root:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
# All ports bind to 127.0.0.1 only. Host ports / DB credentials come from .env (defaults below).
# DB credentials are local-dev defaults; override OPSPILOT_PG_PASSWORD in .env for anything shared.
name: opspilot
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: ${OPSPILOT_PG_USER:-opspilot}
      POSTGRES_PASSWORD: ${OPSPILOT_PG_PASSWORD:-opspilot}
      POSTGRES_DB: ${OPSPILOT_PG_DB:-opspilot}
    ports: ["127.0.0.1:${OPSPILOT_PG_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: { context: .., dockerfile: infra/backend.Dockerfile }
    env_file:
      - path: ../.env
        required: false
    environment:
      # Inside the compose network the DB is always postgres:5432, regardless of host port.
      OPSPILOT_DATABASE_URL: postgresql+psycopg://${OPSPILOT_PG_USER:-opspilot}:${OPSPILOT_PG_PASSWORD:-opspilot}@postgres:5432/${OPSPILOT_PG_DB:-opspilot}
      OPSPILOT_CORS_ORIGINS: '["http://localhost:${OPSPILOT_FRONTEND_PORT:-5173}","http://127.0.0.1:${OPSPILOT_FRONTEND_PORT:-5173}"]'
    ports: ["127.0.0.1:${OPSPILOT_BACKEND_PORT:-8000}:8000"]
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: { context: .., dockerfile: infra/frontend.Dockerfile }
    environment:
      # Vite dev server proxies /api and /health to the backend over the compose network,
      # so the browser stays same-origin on the frontend port (no CORS needed).
      OPSPILOT_BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:${OPSPILOT_FRONTEND_PORT:-5173}:5173"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
