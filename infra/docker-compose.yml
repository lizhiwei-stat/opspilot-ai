# OpsPilot AI local stack. Run from repo root:  docker compose -f infra/docker-compose.yml up -d --build
name: opspilot
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: { context: .., dockerfile: infra/backend.Dockerfile }
    env_file:
      - path: ../.env
        required: false
    environment:
      OPSPILOT_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@postgres:5432/opspilot
      OPSPILOT_CORS_ORIGINS: '["http://localhost:5173"]'
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: { context: .., dockerfile: infra/frontend.Dockerfile }
    environment:
      OPSPILOT_BACKEND_URL: http://backend:8000
    ports: ["5173:5173"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
