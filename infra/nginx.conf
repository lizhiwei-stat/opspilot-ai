# OpsPilot AI production frontend (Stage 5): static SPA + same-origin reverse proxy to the API.
# Listens on 8080 inside the container (unprivileged nginx); the host port binds 127.0.0.1 only.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 12m;  # backend caps uploads at OPSPILOT_MAX_UPLOAD_MB (10 MB)

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    # SSE: no buffering, long read timeout, keep the connection open
    location ~ ^/api/v1/agent/runs/[^/]+/events$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }
    location /health/ {
        proxy_pass http://backend:8000;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # History-API routes (/tickets/TCK-0001 ...) fall back to the SPA shell
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
